
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tga-data-etl"
version = "0.1.0"
description = "ETL for experimental thermogravimetric analysis data"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "sqlalchemy==2.0.48",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4"
]

[dependency-groups]
dev = [
    "requests==2.34.2",
    "matplotlib==3.11.2",
    "seaborn==0.13.2"
]

[tool.setuptools.packages.find]
where = ["src"]
